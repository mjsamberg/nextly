name: Build apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ''
            rust-targets: ''
          - name: macos
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
      - run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: nextly-${{ matrix.name }}
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # Needs these repository secrets (see docs/ios-signing.md):
  #   APPLE_DEVELOPMENT_TEAM, IOS_CERTIFICATE, IOS_CERTIFICATE_PASSWORD, IOS_MOBILE_PROVISION
  # Optional: IOS_EXPORT_METHOD (debugging | release-testing | app-store-connect), default debugging.
  ios:
    needs: test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
      IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
      EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD || 'debugging' }}
    steps:
      - name: Check for signing secrets
        id: secrets
        run: |
          if [ -n "$IOS_CERTIFICATE" ] && [ -n "$IOS_MOBILE_PROVISION" ] && [ -n "$APPLE_DEVELOPMENT_TEAM" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=iOS build skipped::Add the iOS signing secrets described in docs/ios-signing.md to build the iPhone app."
          fi
        working-directory: .
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        if: steps.secrets.outputs.ready == 'true'
        with:
          targets: aarch64-apple-ios
      - uses: swatinem/rust-cache@v2
        if: steps.secrets.outputs.ready == 'true'
        with:
          workspaces: app/src-tauri
      - name: Build signed IPA
        if: steps.secrets.outputs.ready == 'true'
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          npm ci
          npx tauri ios init --ci
          npx tauri ios build --ci --export-method "$EXPORT_METHOD"
      - uses: actions/upload-artifact@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: nextly-ios
          if-no-files-found: error
          path: app/src-tauri/gen/apple/build/**/*.ipa

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/**/*
