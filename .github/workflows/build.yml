name: Build apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Read-only unless a job says otherwise (server-image publishes, release drafts).
permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # what the server's Docker image runs
      - run: npm test

  # The sync server's image, which the home server pulls (server/docker-compose.yml).
  # Only pushes to main publish it, so only reviewed code reaches the server.
  # The package is private like the repo; the server logs in with a read-only
  # token. An attestation records the commit and workflow that built each
  # image (check it with `gh attestation verify`, README). Third-party
  # actions here are pinned to commits, since this job can publish.
  server-image:
    needs: server
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # signs the attestation
      attestations: write
    env:
      IMAGE: ghcr.io/mjsamberg/nextly-server
    steps:
      - uses: actions/checkout@v7
      # amd64 and arm64, so the home server can be a PC, a Raspberry Pi or an Apple-silicon Mac.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Nextly.Core, the C# library behind the native Windows app
  # (docs/parity.md): the shared fixtures, and sync against the real server
  # (needs Node 24).
  windows-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - name: dotnet test (includes spec/fixtures and the sync tests)
        working-directory: windows
        run: dotnet test Nextly.sln -c Release
      - name: Fixture gate (every app runs every shared case)
        run: node scripts/check-fixtures.mjs

  # The native Windows app (windows/Nextly.App), self-contained, in a
  # per-user installer named "Nextly Native" (windows/installer/Nextly.iss).
  # Unsigned for now: Windows SmartScreen warns on first run, and PCs with
  # Smart App Control on won't run it until it's signed (docs/parity.md).
  windows-native:
    needs: windows-core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history: set-version counts the day's commits
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Stamp the date-based version
        run: node scripts/set-version.mjs
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - name: Publish the app (self-contained, x64)
        shell: pwsh
        run: |
          $label = $env:NEXTLY_VERSION_LABEL
          dotnet publish windows/Nextly.App/Nextly.App.csproj -c Release -r win-x64 -p:Platform=x64 `
            -p:Version=$label -p:InformationalVersion=$label -o windows/publish/x64
      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc /Qp "/DAppVersion=$env:NEXTLY_VERSION_LABEL" "/DPublishDir=..\publish\x64" windows/installer/Nextly.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: nextly-windows-native
          if-no-files-found: error
          path: windows/installer-out/*.exe

  # NextlyKit, the Swift package behind the native iOS and macOS apps: the
  # shared fixtures, and sync against the real server (needs Node 24).
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: swift test (includes spec/fixtures and the sync tests)
        working-directory: apple/NextlyKit
        run: swift test
      - name: Fixture gate (every app runs every shared case)
        run: node scripts/check-fixtures.mjs
      # The native app (apple/project.yml), unsigned for now: signing and
      # notarizing come with the widgets (docs/parity.md, Platform).
      - name: Generate the native app's project
        working-directory: apple
        run: brew install xcodegen && xcodegen generate --spec project.yml
      - name: Build the native app for Mac
        working-directory: apple
        run: xcodebuild -project NextlyNative.xcodeproj -scheme Nextly -destination 'generic/platform=macOS' -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build -quiet
      - name: Build the native app for iPhone and iPad (simulator)
        working-directory: apple
        run: xcodebuild -project NextlyNative.xcodeproj -scheme Nextly -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build -quiet

  # The native app, signed. Off until the identifiers are registered
  # and the repository variable NATIVE_SIGNING is "true" (docs/apple-signing.md, step 4).
  native-macos:
    needs: apple
    if: vars.NATIVE_SIGNING == 'true'
    runs-on: macos-latest
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history: set-version counts the day's commits
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Stamp the date-based version
        run: node scripts/set-version.mjs
      - run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash apple/scripts/import-cert.sh
      - name: Build, sign and notarize
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.NEXTLY_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: bash apple/scripts/ci-run.sh "Native Mac app" bash apple/scripts/build-native.sh mac
      - uses: actions/upload-artifact@v7
        with:
          name: nextly-native-macos
          if-no-files-found: error
          path: apple/build/native/Nextly-Native-mac.zip

  native-ios:
    needs: apple
    if: vars.NATIVE_SIGNING == 'true'
    runs-on: macos-latest
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
      EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD || 'debugging' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Stamp the date-based version
        run: node scripts/set-version.mjs
      - run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      # One fixed certificate, so automatic signing doesn't make a new one each run.
      - name: Import the iPhone signing certificate
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: bash apple/scripts/import-ios-cert.sh
      - name: Build signed IPA
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          bash apple/scripts/ci-run.sh "Native iPhone app" bash apple/scripts/build-native.sh ios
      - uses: actions/upload-artifact@v7
        with:
          name: nextly-native-ios
          if-no-files-found: error
          path: apple/build/native/ios/*.ipa

  # A tag like v2026.10.24.3 makes a draft release with every build. The
  # signed Apple builds are skipped while NATIVE_SIGNING is off; the release
  # goes ahead with whatever was built.
  release:
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && !failure()
    needs: [windows-native, native-macos, native-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: dist/**/*
