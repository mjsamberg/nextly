# XcodeGen spec for the macOS widget and Siri extensions. The Mac app itself
# is built by Tauri; CI builds these two, signs them, and copies them into
# Nextly.app (see scripts/build-macos-extensions.sh).
# ${...} values come from the environment.

name: NextlyMac
options:
  bundleIdPrefix: com.mjsamberg.nextly
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "${APPLE_DEVELOPMENT_TEAM}"
    ENABLE_HARDENED_RUNTIME: true
    SKIP_INSTALL: true

targets:
  NextlyWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Shared
      - path: Widgets
    info:
      path: build/macos/NextlyWidgets-Info.plist
      properties:
        CFBundleDisplayName: Nextly
        CFBundleShortVersionString: "${NEXTLY_VERSION}"
        CFBundleVersion: "${NEXTLY_BUILD}"
        NextlyAppGroup: "${NEXTLY_APP_GROUP}"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: build/macos/NextlyWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: ["${NEXTLY_APP_GROUP}"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mjsamberg.nextly.widgets
        PRODUCT_NAME: NextlyWidgets
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  NextlyIntents:
    type: extensionkit-extension
    platform: macOS
    sources:
      - path: Shared
      - path: Intents
    info:
      path: build/macos/NextlyIntents-Info.plist
      properties:
        CFBundleDisplayName: Nextly
        CFBundleShortVersionString: "${NEXTLY_VERSION}"
        CFBundleVersion: "${NEXTLY_BUILD}"
        NextlyAppGroup: "${NEXTLY_APP_GROUP}"
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.appintents-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: build/macos/NextlyIntents.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: ["${NEXTLY_APP_GROUP}"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mjsamberg.nextly.intents
        PRODUCT_NAME: NextlyIntents
    dependencies:
      - sdk: AppIntents.framework
      - sdk: WidgetKit.framework
