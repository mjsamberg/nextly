[package]
name = "nextly"
version = "0.1.0"
description = "Nextly task manager"
edition = "2021"

# The lib target is what iOS links; main.rs is the desktop entry point.
[lib]
name = "nextly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-websocket = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# App Group container lookup for the widget and Siri extensions (apple.rs).
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSString"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
